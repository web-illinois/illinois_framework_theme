uuid: c8ad6b11-ff90-48bd-815d-2e690458f793
langcode: en
status: true
dependencies:
  config:
    - filter.format.basic_html
  module:
    - ckeditor5
format: basic_html
editor: ckeditor5
settings:
  toolbar:
    items:
      - bold
      - italic
      - subscript
      - superscript
      - '|'
      - link
      - drupalMedia
      - videoEmbed
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - alignment
      - blockQuote
      - horizontalLine
      - '|'
      - heading
      - style
      - '|'
      - insertTable
      - sourceEditing
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: false
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<h2 id>'
        - '<h3 id>'
        - '<h4 id>'
        - '<h5 id>'
        - '<h6 id>'
        - '<img src alt data-entity-type data-entity-uuid data-align data-caption width height>'
        - '<cite>'
        - '<dl>'
        - '<dt>'
        - '<dd>'
        - '<q>'
        - '<address>'
        - '<div>'
    ckeditor5_style:
      styles:
        -
          label: 'Base Button'
          element: '<a class="il-button">'
        -
          label: 'White with blue button'
          element: '<a class="il-button il-white-blue">'
        -
          label: 'White with orange button'
          element: '<a class="il-button il-white-orange">'
        -
          label: 'Solid blue button'
          element: '<a class="il-button il-blue">'
        -
          label: 'Solid orange button'
          element: '<a class="il-button il-orange">'
    linkit_extension:
      linkit_enabled: false
    media_media:
      allow_view_mode_override: true
    video_embed_wysiwyg_video_embed:
      defaults:
        children:
          autoplay: false
          responsive: true
          width: '854'
          height: '480'
image_upload:
  status: false
