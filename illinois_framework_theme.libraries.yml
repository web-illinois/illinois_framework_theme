global-styling:
  css:
    theme:
      fonts/font-awesome-4.7.0/css/font-awesome.css: {}
      fonts/font-awesome-4.7.0/css/illinois-icons.css: {}
      scss/style.scss: { }
  js:
    https://emergency.publicaffairs.illinois.edu/illinois.js:
      type: external
      attributes:
        async: true
    https://enroll.illinois.edu/ping:
      type: external
      attributes:
        async: true
    js/search.js: {}
    js/side-nav-title-append.js: {}
    js/paragraph-whitespace.js: {}
  dependencies:
    - core/jquery
web-components:
  header: true
  css:
    theme:
      https://cdn.toolkit.illinois.edu/3/toolkit.css:
        type: external
        minified: true
  js:
    https://cdn.toolkit.illinois.edu/3/toolkit.js:
      type: external
      minified: true
      attributes:
        type: module
        blocking: render
brand-styles:
  header: true
  css:
    theme:
      https://cdn.brand.illinois.edu/illinois.css:
        type: external
        minified: true
ils-contentslider:
  header: true
  css:
    theme:
      https://contrib.webtheme.illinois.edu/ils-contentslider/contentslider.min.css:
        type: external
        minified: true
  js:
    https://contrib.webtheme.illinois.edu/ils-contentslider/contentslider.min.js:
      type: external
      minified: true
il-header:
  header: true
  css:
    theme:
      https://cdn.brand.illinois.edu/components/il-header.css:
        type: external
        minified: true
  js:
    https://cdn.brand.illinois.edu/components/il-header.mjs:
      type: external
      minified: true
      attributes:
        type: module
        blocking: render
il-footer:
  header: true
  css:
    theme:
      https://cdn.brand.illinois.edu/components/il-footer.css:
        type: external
        minified: true
  js:
    https://cdn.brand.illinois.edu/components/il-footer.mjs:
      type: external
      minified: true
      attributes:
        type: module
        blocking: render
content-adjust:
  js:
    js/content.js: {}
paragraph--hero--section:
  js:
    js/paragraph--hero--section.js: {}
  dependencies:
    - core/jquery
google-cse:
  js:
    js/google-cse.js: { attributes: { async: true } }
  dependencies:
    - core/jquery
    - core/drupalSettings
