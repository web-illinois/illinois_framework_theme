      css/component/components.google-translate.css: {}
      css/component/menu.css: {}
      css/component/field.css: {}
      css/component/messages.css: {}
      css/component/pager.css: {}
      css/form/form.css: {}
      css/views/view.news.css: {}
      css/paragraphs/paragraphs.spotlight.css: {}
    theme:
      css/print.css: { media: print }
web-components:
  header: true
  css:
    component:
      https://cdn.toolkit.illinois.edu/3/toolkit.css:
        type: external
        minified: true
  js:
    https://cdn.toolkit.illinois.edu/3/toolkit.js:
      type: external
      minified: true
      attributes:
        type: module
        blocking: render
