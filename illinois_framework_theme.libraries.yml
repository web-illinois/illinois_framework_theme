    https://enroll.illinois.edu/ping:
      type: external
      attributes:
        async: true
    js/table-mobile.js: {}
  dependencies:
    - core/drupal
    - core/once
  css:
    base:
      css/base/reset.css: {}
    layout:
      css/layout/layout.css: {}
    component:
      css/regions/region.footer.css: {}
      css/node/node.css: {}
      css/node/node.blog.css: {}
      css/node/node.spotlight-family.css: {}
      css/node/node.news.css: {}
      css/node/node.teaser.css: {}
      css/media/media.css: {}
