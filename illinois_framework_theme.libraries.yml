global:
  js:
    https://emergency.publicaffairs.illinois.edu/illinois.js:
      type: external
      attributes:
        async: true
    https://enroll.illinois.edu/ping:
      type: external
      attributes:
        async: true
    js/table-mobile.js: {}
  dependencies:
    - core/drupal
    - core/once
  css:
    theme:
      css/style.css: {}
      fonts/font-awesome-4.7.0/css/font-awesome.css: { }
      fonts/font-awesome-4.7.0/css/illinois-icons.css: { }
      css/print.css: { media: print }
web-components:
  header: true
  css:
    component:
      https://cdn.toolkit.illinois.edu/3/toolkit.css:
        type: external
        minified: true
  js:
    https://cdn.toolkit.illinois.edu/3/toolkit.js:
      type: external
      minified: true
      attributes:
        type: module
        blocking: render
ils-contentslider:
  header: true
  css:
    theme:
      https://contrib.webtheme.illinois.edu/ils-contentslider/contentslider.min.css:
        type: external
        minified: true
  js:
    https://contrib.webtheme.illinois.edu/ils-contentslider/contentslider.min.js:
      type: external
      minified: true
    js/paragraph-content-slider.js: { }
  dependencies:
    - core/drupal
    - core/once
google-cse:
  js:
    js/google-cse.js: { attributes: { async: true } }
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
ils-forms:
  css:
    theme:
      https://contrib.webtheme.illinois.edu/ils-input/input3.min.css:
        type: external
        minified: true
