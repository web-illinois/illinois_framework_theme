# .github/workflows/create-release.yml
# This workflow is triggered manually to create a new release.
# It updates the version, tags the commit, and opens a DRAFT GitHub Release
# with auto-generated notes so you can add custom notes before publishing.

name: Create New Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The new version number (e.g., 1.2.3)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build and print the info.yml, but do NOT commit, tag, or release.'
        required: false
        default: false
        type: boolean

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit, tag, and release.
      contents: write
      # Needed to read the issues linked to each pull request in the release.
      issues: read
    steps:
      - name: Generate a token from the release GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history + tags are needed to diff against the previous
          # release when drafting release notes.
          fetch-depth: 0
          # Use the release GitHub App installation token so the tag push
          # satisfies the "Restrict creations" tag ruleset. The App is on the
          # ruleset bypass list; GITHUB_TOKEN / github-actions[bot] is not.
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Author the version-bump commit as the release App's bot identity so
          # history reflects the same App that pushes the tag.
          BOT_NAME='${{ steps.app-token.outputs.app-slug }}[bot]'
          BOT_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          git config --global user.name "${BOT_NAME}"
          git config --global user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"

      - name: Ensure tag does not already exist
        run: |
          # Fail fast (before the AI call and any commit) if the release tag
          # already exists locally or on the remote. The workflow never uses
          # --force, so a pre-existing tag would otherwise fail later with a
          # raw git error; this gives a clear message and avoids wasted work.
          VERSION="${{ github.event.inputs.version }}"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists. Choose a new version or delete the existing tag."
            exit 1
          fi

      - name: Add packaging metadata to info.yml
        run: |
          # Mirrors the Drupal.org packaging script, which appends a
          # version/project/datestamp block to each .info.yml at build time.
          VERSION="${{ github.event.inputs.version }}"
          PROJECT="illinois_framework_theme"
          INFO_FILE="illinois_framework_theme.info.yml"
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          DATESTAMP="$(date -u +%s)"

          # Strip any existing packaging metadata so re-runs stay idempotent
          # (removes the comment line plus the three generated keys).
          sed -i \
            -e '/^# Information added by .* packaging script on /d' \
            -e '/^version: /d' \
            -e '/^project: /d' \
            -e '/^datestamp: /d' \
            "$INFO_FILE"

          # Drop any trailing blank lines left behind before appending.
          awk 'NF{last=NR} {line[NR]=$0} END{for(i=1;i<=last;i++) print line[i]}' \
            "$INFO_FILE" > "$INFO_FILE.tmp" && mv "$INFO_FILE.tmp" "$INFO_FILE"

          # Append a fresh metadata block. Single quotes matter for Drupal's
          # YAML parser (keeps version strings like '5.0' from becoming floats).
          # Built with printf (not a heredoc) so the block stays indented inside
          # this YAML step while still writing column-0 lines to the info file.
          {
            printf '\n'
            printf '# Information added by web-illinois packaging script on %s\n' "$BUILD_DATE"
            printf "version: '%s'\n" "$VERSION"
            printf "project: '%s'\n" "$PROJECT"
            printf 'datestamp: %s\n' "$DATESTAMP"
          } >> "$INFO_FILE"

          echo "----- Generated $INFO_FILE -----"
          cat "$INFO_FILE"

      - name: Determine previous release tag
        id: prevtag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # The release tag isn't created yet. Pick the highest MAJOR.MINOR.PATCH
          # tag strictly BELOW the version being released, so neither tag creation
          # dates nor a newer release line (e.g. 6.0.0 while patching 5.x) can
          # pick the wrong predecessor. Empty on the very first release.
          PREV_TAG="$( { git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; printf '%s\n' "$VERSION"; } \
            | sort -V -u | grep -B1 -x -- "$VERSION" | awk 'NR==1' )"
          if [ "$PREV_TAG" = "$VERSION" ]; then
            PREV_TAG=""
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV_TAG:-<none>}"

      - name: Commit version update
        if: github.event.inputs.dry_run != 'true'
        id: commit
        run: |
          git add illinois_framework_theme.info.yml
          # Check if there are any changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "Chore: Bump version to ${{ github.event.inputs.version }}"
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "No version change detected."
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: github.event.inputs.dry_run != 'true' && steps.commit.outputs.changes == 'true'
        run: |
          # Tag the local version-bump commit, then push ONLY the tag.
          # The protected branch (e.g. 5.x) is never pushed to, so branch
          # protection is satisfied. The metadata-bearing commit is reachable
          # via the tag, which is what the Composer VCS install pulls from.
          git tag "${{ github.event.inputs.version }}"
          git push origin "refs/tags/${{ github.event.inputs.version }}"

      - name: Compose release notes
        id: ghnotes
        if: github.event.inputs.dry_run == 'true' || steps.commit.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          PREV_TAG: ${{ steps.prevtag.outputs.prev_tag }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          # On a dry run the version-bump commit is never created, so describe the
          # checked-out branch tip instead; otherwise use the freshly tagged commit.
          if [ "$DRY_RUN" = "true" ]; then
            TARGET="$GITHUB_SHA"
          else
            TARGET="$(git rev-parse HEAD)"
          fi

          # GitHub cannot infer the previous tag for these releases: the tagged
          # version-bump commit lives off-branch (only the tag is pushed), so
          # earlier release tags are not ancestors of it and the inference falls
          # back to the last on-branch tag. Pass previous_tag_name explicitly.
          ARGS=(-f tag_name="$VERSION" -f target_commitish="$TARGET")
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(-f previous_tag_name="$PREV_TAG")
          fi

          if ! BODY="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${ARGS[@]}" --jq .body)"; then
            echo "::warning::generate-notes failed; falling back to the release action's auto-generated notes."
            printf '%s\n\n%s\n' '## Release Notes' '_Add a short summary of this release here before publishing._' > RELEASE_BODY.md
            echo "appended=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every PR in the range, taken from the list GitHub just generated.
          PRS="$(printf '%s' "$BODY" | grep -oE "https://github\.com/${GITHUB_REPOSITORY}/pull/[0-9]+" \
            | grep -oE '[0-9]+$' | sort -un || true)"

          # Ask for each PR's linked issues -- the ones shown in the PR sidebar's
          # "Development" section, i.e. closed by merging it. One batched query
          # with p0..pN aliases keeps this to a single API round trip. Linked
          # issues may live in a sibling repo (core/profile work is often tracked
          # in the theme repo), which is why the repo name is requested too.
          ISSUES=""
          if [ -n "$PRS" ]; then
            QUERY='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){'
            i=0
            for pr in $PRS; do
              QUERY="${QUERY}p${i}:pullRequest(number:${pr}){closingIssuesReferences(first:20){nodes{number title url repository{nameWithOwner}}}} "
              i=$((i+1))
            done
            QUERY="${QUERY}}}"

            # gh exits non-zero when ANY alias errors -- e.g. a linked issue in a
            # repo this token cannot read -- even though the rest of the response
            # is perfectly usable, so capture the raw JSON and filter it here
            # instead of with "gh --jq", and keep whatever did resolve.
            RESP="$(gh api graphql \
              -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY##*/}" \
              -f query="$QUERY" 2>/dev/null || true)"

            if printf '%s' "$RESP" | jq -e 'has("errors")' >/dev/null 2>&1; then
              echo "::warning::Some linked issues could not be read; the \"Issues Closed\" list may be incomplete."
            fi

            # Emitted fully qualified, then shortened for issues in this repo so
            # both same-repo (#12) and cross-repo (owner/repo#12) refs autolink.
            ISSUES="$(printf '%s' "$RESP" | jq -r '
                [ .data.repository[]? | select(. != null) | .closingIssuesReferences.nodes[]? ]
                | unique_by(.url)
                | sort_by(.repository.nameWithOwner, .number)
                | .[] | "- \(.title) (\(.repository.nameWithOwner)#\(.number))"' 2>/dev/null \
              | sed "s|(${GITHUB_REPOSITORY}#|(#|")" || ISSUES=""

            if [ -z "$ISSUES" ]; then
              echo "No linked issues found for this range; omitting the \"Issues Closed\" section."
            fi
          fi

          # The summary line is a placeholder on purpose: releases are created as
          # drafts, so a maintainer replaces it before publishing.
          {
            printf '## Release Notes\n\n'
            printf '%s\n' '_Add a short summary of this release here before publishing._'
            if [ -n "$ISSUES" ]; then
              printf '\n### Issues Closed\n\n%s\n' "$ISSUES"
            fi
            printf '\n%s\n' "$BODY"
          } > RELEASE_BODY.md

          echo "appended=true" >> "$GITHUB_OUTPUT"
          echo "Previous tag used: ${PREV_TAG:-<none>}"
          echo "----- RELEASE_BODY.md -----"
          cat RELEASE_BODY.md
      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run enabled — no commit, tag, or release was created."
          {
            echo "### Dry run: generated info.yml"
            echo '```yaml'
            cat illinois_framework_theme.info.yml
            echo '```'
            echo "### Dry run: generated release notes"
            echo "_This is the exact body the draft release would be created with._"
            echo ""
            cat RELEASE_BODY.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release (draft)
        if: github.event.inputs.dry_run != 'true' && steps.commit.outputs.changes == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ github.event.inputs.version }}"
          name: "Release ${{ github.event.inputs.version }}"
          # RELEASE_BODY.md was fully composed by the previous step: the
          # summary placeholder, the "Issues Closed" list, and GitHub's
          # "What's Changed" PR list built against the explicit previous tag.
          # The action's own generate_release_notes is only a fallback for when
          # that step could not reach the API, because it would otherwise infer
          # the wrong previous tag. Created as a draft so you can write the
          # summary and review the notes before publishing.
          body_path: RELEASE_BODY.md
          generate_release_notes: ${{ steps.ghnotes.outputs.appended != 'true' }}
          draft: true
          prerelease: false
